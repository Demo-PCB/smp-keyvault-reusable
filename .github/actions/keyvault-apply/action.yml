name: Key Vault Apply
description: Create missing Azure Key Vault secrets with an initial placeholder value and never overwrite protected values.
inputs:
  keyvault-name:
    description: Azure Key Vault name
    required: true
  data-file-path:
    description: Path to data.json containing secret names
    required: true
  initial-secret-value:
    description: Initial placeholder value for newly created secrets
    required: false
    default: DEMO
outputs:
  status:
    description: Deployment status
    value: ${{ steps.apply.outputs.status }}
  created-count:
    description: Number of secrets created
    value: ${{ steps.apply.outputs.created-count }}
  skipped-count:
    description: Number of protected existing secrets skipped
    value: ${{ steps.apply.outputs.skipped-count }}
  demo-count:
    description: Number of existing DEMO secrets left unchanged
    value: ${{ steps.apply.outputs.demo-count }}
runs:
  using: composite
  steps:
    - name: Create missing secrets safely
      id: apply
      shell: bash
      run: |
        set -euo pipefail
        KEYVAULT_NAME='${{ inputs.keyvault-name }}'
        DATA_FILE='${{ inputs.data-file-path }}'
        INITIAL_VALUE='${{ inputs.initial-secret-value }}'
        CREATED=0
        SKIPPED=0
        DEMO=0

        if [ ! -f "$DATA_FILE" ]; then
          echo "::error::Data file not found: $DATA_FILE"
          exit 1
        fi

        while IFS= read -r SECRET_NAME; do
          if CURRENT_VALUE=$(az keyvault secret show --vault-name "$KEYVAULT_NAME" --name "$SECRET_NAME" --query value -o tsv 2>/dev/null); then
            if [ "$CURRENT_VALUE" = "$INITIAL_VALUE" ]; then
              echo "NO_CHANGE: $SECRET_NAME already exists with $INITIAL_VALUE"
              DEMO=$((DEMO + 1))
            else
              echo "SKIP_PROTECTED_VALUE: $SECRET_NAME has a non-DEMO value"
              SKIPPED=$((SKIPPED + 1))
            fi
          else
            echo "CREATE: $SECRET_NAME"
            az keyvault secret set --vault-name "$KEYVAULT_NAME" --name "$SECRET_NAME" --value "$INITIAL_VALUE" --output none
            CREATED=$((CREATED + 1))
          fi
        done < <(jq -r 'keys[]' "$DATA_FILE")

        echo 'status=success' >> "$GITHUB_OUTPUT"
        echo "created-count=$CREATED" >> "$GITHUB_OUTPUT"
        echo "skipped-count=$SKIPPED" >> "$GITHUB_OUTPUT"
        echo "demo-count=$DEMO" >> "$GITHUB_OUTPUT"
